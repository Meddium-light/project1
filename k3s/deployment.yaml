#тут живет наш деплоймент, объявляем его кайнд, реплики чтобы контроллер менеджер следил, имя и имаге
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project1
  template:
    metadata:
      labels:
        app: project1
    spec:
      containers:
        - name: project1
          image: ghcr.io/meddium-light/project1:latest
          ports:
            - containerPort: 80
